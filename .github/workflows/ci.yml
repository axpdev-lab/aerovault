name: CI

# Run the test suite on Linux, Windows and macOS. Some fixes are Windows-specific
# (for example legacy vault writes replacing the file by rename), so they are
# exercised on a Windows runner, not only type-checked.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --release --no-fail-fast

      - name: Windows 8.3 vault leaf recovery regression
        if: matrix.os == 'windows-latest'
        run: cargo test --release -p aerovault --lib review_windows_short_name_rotation_refreshes_long_name_sidecar -- --nocapture

      - name: HFS+ filename and sidecar lock regression
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          image="$RUNNER_TEMP/aerovault-hfs.dmg"
          mount="$RUNNER_TEMP/aerovault-hfs"
          hdiutil create -size 128m -fs HFS+ -volname AeroVaultTest "$image"
          mkdir -p "$mount"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse
          trap 'hdiutil detach "$mount"' EXIT
          AEROVAULT_TEST_HFS_ROOT="$mount" cargo test --release -p aerovault --lib review_hfs_ -- --ignored --nocapture

  msrv:
    name: Test Rust 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.89
      - run: cargo test --workspace --release --no-fail-fast
