[package]
name = "aerovault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories = ["cryptography", "filesystem", "compression"]
description = "Encrypted vault container format in Rust: AES-256-GCM-SIV, Argon2id, AES-KW, HMAC-SHA512, content-defined chunking with deduplication, and detached Reed-Solomon .aerocorrect error-correction sidecars"
readme = "../README.md"

[features]
# Test-only: replace the CSPRNG with a deterministic stream and freeze the
# timestamp so containers are byte-reproducible for the cross-impl golden (T5).
# Refused without debug assertions. Never enable in a production build.
test-vectors = []
# Test-only: derive keys with the cheapest Argon2id profile (8 MiB, t=1)
# instead of the audited 128 MiB / t=4, so a consumer's test suite that
# creates and opens thousands of vaults does not spend its time in the KDF.
# A vault written under this feature cannot be opened by a production build
# (the profile is a format constant, not a header field), which is the point:
# it is refused at compile time in any non-debug build. Never ship it.
fast-kdf-for-tests = []

[dependencies]
aes-gcm-siv = { workspace = true }
aes-kw = { workspace = true }
aes-siv = { workspace = true }
argon2 = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
data-encoding = { workspace = true }
zstd = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
reed-solomon-erasure = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
